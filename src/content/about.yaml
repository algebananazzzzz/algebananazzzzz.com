heroSub: 'Why Algebananazzzzz? This alias stuck to me since Primary School when I was obsessed with algebra and minions at the same time. Feel free to explore around this space and get to know me better!'

intro: "I'm Daniel, a NUS CS undergrad hoping to specialize in Infrastructure and Systems."
what:
  - "If I wasn't into tech I'd definitely be a chef. They are always seeking ways to experiment and invent new flavors, infuse their soul into every dish, and wholeheartedly love what they put out. This is exactly who I want to be."
  - 'I love exploring retro and foundational technology. By deep diving and reinventing some wheels in my homelab setup, I hope to better appreciate the history and evolutions in systems we take granted.'
  - "I'm also deeply invested in the latest technologies like LLMs and Blockchain, always keeping myself up to date with what's new. I love experimentation and creating stuff, which is evident from all my hobbies!"
valuesHeading: 'A few working principles'
values:
  - label: 'Learning is always free'
    note: "This goes two ways: there's no opportunity cost to learning, and if there are financial costs it's amortized."
  - label: 'Do it and get burnt'
    note: "You don't learn heat by reading about fire, so just ship it, break it, and internalize the process."
  - label: "It's okay to reinvent the wheel"
    note: "Don't take things for granted. Real innovation comes when you do things differently, more often than not."
